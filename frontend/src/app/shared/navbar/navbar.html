<div
  class="sticky top-0 z-40 flex min-h-20 items-center justify-between gap-4 border-b border-white/10 bg-slate-950/75 px-5 py-4 backdrop-blur-xl sm:px-8">

  <!-- Title -->
  <div>

    <h1 class="text-xl font-bold text-white sm:text-2xl">
      Mpolychk Console
    </h1>

    <p class="text-sm text-slate-400">
      Enterprise identity, access, and verification operations
    </p>

  </div>

  <!-- User -->
  <div class="flex items-center gap-3">
    <a
      routerLink="/dashboard"
      class="hidden rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-sm text-slate-300 transition hover:bg-white/[0.08] hover:text-white sm:inline-flex">
      Overview
    </a>

    <button
      type="button"
      class="rounded-xl border border-white/10 bg-white/[0.04] px-4 py-2 text-sm text-slate-300 transition hover:bg-rose-500/10 hover:text-rose-200"
      (click)="logout()">
      Logout
    </button>

    <div
      class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-br from-cyan-400 via-blue-500 to-violet-500 font-bold text-white">
      {{ session?.userId?.slice(0, 1)?.toUpperCase() || 'M' }}
    </div>
  </div>

</div>
