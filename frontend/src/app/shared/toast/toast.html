<div class="fixed right-5 top-5 z-[60] flex w-[360px] max-w-[calc(100vw-2.5rem)] flex-col gap-3">
  @for (message of messages$ | async; track message.id) {
    <article
      class="rounded-2xl border bg-slate-950/95 p-4 shadow-2xl backdrop-blur-xl"
      [ngClass]="{
        'border-emerald-400/30 shadow-emerald-500/10': message.tone === 'success',
        'border-cyan-400/30 shadow-cyan-500/10': message.tone === 'info',
        'border-amber-400/30 shadow-amber-500/10': message.tone === 'warning',
        'border-rose-400/30 shadow-rose-500/10': message.tone === 'danger'
      }">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-sm font-semibold text-white">
            {{ message.title }}
          </h3>

          <p class="mt-1 text-sm text-slate-400">
            {{ message.message }}
          </p>
        </div>

        <button
          type="button"
          class="text-sm text-slate-500 transition hover:text-white"
          aria-label="Dismiss notification"
          (click)="dismiss(message.id)">
          x
        </button>
      </div>
    </article>
  }
</div>
