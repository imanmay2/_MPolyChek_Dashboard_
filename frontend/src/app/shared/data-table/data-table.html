<div class="overflow-hidden rounded-2xl border border-white/10">
  <div
    class="grid min-w-[760px] bg-white/[0.04] px-5 py-4 text-xs font-semibold uppercase tracking-[0.14em] text-slate-400"
    [style.grid-template-columns]="'repeat(' + columns.length + ', minmax(0, 1fr))'">
    @for (column of columns; track column.label) {
      <div>
        {{ column.label }}
      </div>
    }
  </div>

  @if (rows.length) {
    <div class="max-h-[520px] min-w-[760px] overflow-y-auto">
      @for (row of rows; track trackByRow($index, row)) {
        <button
          type="button"
          class="grid w-full px-5 py-4 text-left text-sm transition hover:bg-white/[0.04]"
          [style.grid-template-columns]="'repeat(' + columns.length + ', minmax(0, 1fr))'"
          (click)="rowSelected.emit(row)">
          @for (column of columns; track column.label) {
            <span class="truncate text-slate-200">
              {{ getCellValue(row, column) }}
            </span>
          }
        </button>
      }
    </div>
  } @else {
    <div class="grid min-h-40 place-items-center px-6 py-10 text-sm text-slate-400">
      {{ emptyMessage }}
    </div>
  }
</div>
