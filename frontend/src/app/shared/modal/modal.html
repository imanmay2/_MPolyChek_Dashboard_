@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center px-4 py-6">
    <button
      type="button"
      class="absolute inset-0 bg-slate-950/70 backdrop-blur-md"
      aria-label="Close modal"
      (click)="close()">
    </button>

    <section
      class="relative w-full max-w-2xl overflow-hidden rounded-3xl border border-white/10 bg-slate-950/95 shadow-2xl shadow-cyan-500/10">
      <div class="border-b border-white/10 px-6 py-5">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 class="text-xl font-semibold text-white">
              {{ title }}
            </h2>

            @if (subtitle) {
              <p class="mt-1 text-sm text-slate-400">
                {{ subtitle }}
              </p>
            }
          </div>

          <button
            type="button"
            class="grid h-10 w-10 place-items-center rounded-xl border border-white/10 bg-white/[0.04] text-slate-300 transition hover:bg-white/[0.08] hover:text-white"
            aria-label="Close modal"
            (click)="close()">
            x
          </button>
        </div>
      </div>

      <div class="px-6 py-6">
        <ng-content></ng-content>
      </div>
    </section>
  </div>
}
