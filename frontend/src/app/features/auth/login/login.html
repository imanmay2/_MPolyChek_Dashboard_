<div class="min-h-screen bg-[#0f172a] flex items-center justify-center relative overflow-hidden">

  <!-- Background Glow -->
  <div
    class="absolute w-96 h-96 bg-blue-500/20 rounded-full blur-3xl top-[-100px] left-[-100px]">
  </div>

  <div
    class="absolute w-96 h-96 bg-purple-500/20 rounded-full blur-3xl bottom-[-100px] right-[-100px]">
  </div>

  <!-- Login Card -->
  <div
    class="w-[420px] backdrop-blur-2xl bg-white/[0.05] border border-white/10 rounded-3xl p-8 shadow-2xl shadow-blue-500/10 hover:shadow-blue-500/20 transition-all duration-500 z-10">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">

      <div
        class="w-16 h-16 rounded-2xl bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center text-2xl font-bold text-white">
        M
      </div>

      <h1 class="text-4xl font-bold mt-5 text-white">
        MployCheck
      </h1>

      <p class="text-gray-400 mt-2 text-sm">
        Enterprise Access Management
      </p>

    </div>

    <!-- Form -->
    <form class="flex flex-col gap-6 mt-6">

      <!-- User ID -->
      <mat-form-field appearance="outline" class="custom-field">

        <mat-label>User ID</mat-label>

        <input
          matInput
          placeholder="Enter User ID">

      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="custom-field">

        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          placeholder="Enter Password">

      </mat-form-field>

      <!-- Role -->
      <mat-form-field appearance="outline" class="custom-field">

        <mat-label>Select Role</mat-label>

        <mat-select panelClass="custom-dropdown">

          <mat-option value="user">
            General User
          </mat-option>

          <mat-option value="admin">
            Admin
          </mat-option>

        </mat-select>

      </mat-form-field>

      <!-- Login Button -->
      <button
        mat-raised-button
        class="w-full !h-12 !rounded-2xl !bg-gradient-to-r !from-blue-500 !to-purple-600 !text-white !font-semibold hover:!scale-[1.02] hover:!shadow-xl hover:!shadow-blue-500/30 transition-all duration-300">

        Login

      </button>

    </form>

  </div>

</div>
